[workspace]
members = [
    "compression",
    "dynamic",
    "iobuf",
    "iobuf_sys",
    "logging",
    "memory",
    "network_address",
    "request_context",
    "singleton_vault",
    "socket_address",
    "string",
    "string_sys",
    "tdigest",
]
resolver = "2"

# nightly-2026-05-22 on macOS loses loadable proc-macro crate metadata when
# Cargo applies `-C strip=debuginfo` to release dylibs. The workspace installs
# source rather than these compiler-private artifacts, so retain the metadata
# for release validation builds.
[profile.release]
strip = "none"
